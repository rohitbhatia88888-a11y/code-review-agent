name: Review PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # PRs from forks get a read-only GITHUB_TOKEN by default, so --post
    # will fail to post comments there -- that's GitHub's own security
    # boundary, not a bug in this workflow. The job still runs and the
    # decision trace still uploads, so findings are visible either way.
    steps:
      - name: Check out PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Review PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run python -m src.agent.review \
            --pr-url "https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" \
            --post

      - name: Print decision trace
        if: always()
        run: cat results/traces/*.jsonl || true

      - name: Upload decision trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-trace-pr-${{ github.event.pull_request.number }}
          path: results/traces/
          retention-days: 30
